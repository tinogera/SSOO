name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

jobs:
  test-utils:
    name: Build y tests de utils
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential libreadline-dev

      - name: Instalar so-commons-library
        run: |
          git clone https://x-access-token:${{ github.token }}@github.com/sisoputnfrba/so-commons-library.git
          cd so-commons-library
          sudo make install

      - name: Compilar cspecs y copiar a vendor
        run: |
          mkdir -p /tmp/cspec
          curl -fsSL "https://github.com/mumuki/cspec/archive/043089d9c55871526f1d6728af4d0febdbe8c38a.tar.gz" \
            | tar -xzC /tmp/cspec --strip-components=1
          make -C /tmp/cspec
          mkdir -p utils/vendor/cspecs/lib
          cp /tmp/cspec/release/libcspecs.so utils/vendor/cspecs/lib/libcspecs.so

      - name: Compilar y ejecutar tests
        run: |
          cd utils
          mkdir -p bin
          make test
          ./bin/utils_tests

  test-io:
    name: Build y tests de IO
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential libreadline-dev

      - name: Instalar so-commons-library
        run: |
          git clone https://x-access-token:${{ github.token }}@github.com/sisoputnfrba/so-commons-library.git
          cd so-commons-library
          sudo make install

      - name: Compilar cspecs y copiar a vendor
        run: |
          mkdir -p /tmp/cspec
          curl -fsSL "https://github.com/mumuki/cspec/archive/043089d9c55871526f1d6728af4d0febdbe8c38a.tar.gz" \
            | tar -xzC /tmp/cspec --strip-components=1
          make -C /tmp/cspec
          mkdir -p utils/vendor/cspecs/lib
          cp /tmp/cspec/release/libcspecs.so utils/vendor/cspecs/lib/libcspecs.so
          mkdir -p io/vendor/cspecs/lib
          cp /tmp/cspec/release/libcspecs.so io/vendor/cspecs/lib/libcspecs.so

      - name: Compilar utils
        run: cd utils && make

      - name: Compilar y ejecutar tests de IO
        run: |
          cd io
          mkdir -p bin
          make test
          ./bin/io_tests

  test-kernel-scheduler:
